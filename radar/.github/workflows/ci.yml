name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Los tests de idempotencia y de RLS aplican la migración real contra un
        # Postgres de verdad. Sin esto solo se probaría la lógica pura.
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://radar:radar@127.0.0.1:5432/radar_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radar/package-lock.json

      - run: npm ci
        working-directory: radar

      - run: npm run typecheck
        working-directory: radar

      - run: npm run test
        working-directory: radar

      - run: npm run build
        working-directory: radar
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
